name: Build Android APK
on:
  workflow_dispatch: # Allows you to trigger manually
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
    - name: Scaffold App and Compile
      run: |
        flutter create maaa_app --org com.example
        cp -rf source_code/* mamaa_app/ || true
        cd maaa_app
        flutter build apk --release
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mamaa-app-release
        path: mamaa_app/build/app/outputs/flutter-apk/app-release.apk
